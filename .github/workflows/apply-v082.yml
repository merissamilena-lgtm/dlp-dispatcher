name: Apply DLP Dispatcher v0.8.2

on:
  push:
    branches: [main]
    paths:
      - 'tools/trigger-v082.txt'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Apply v0.8.2 polish hotfix
        run: node tools/apply-v082.mjs

      - name: Validate JavaScript
        run: |
          node --check app.js
          node --check sw.js

      - name: Verify v0.8.2 anchors
        run: |
          node <<'NODE'
          const fs=require('fs');
          const app=fs.readFileSync('app.js','utf8');
          const html=fs.readFileSync('index.html','utf8');
          const css=fs.readFileSync('styles.css','utf8');
          const sw=fs.readFileSync('sw.js','utf8');
          const checks=[
            [app,'DLP DISPATCHER STATUS v0.8.2'],
            [app,'cloudBackendReady: false'],
            [app,'async function probeCloudBackend()'],
            [css,'/* v0.8.2 sticky view tabs */'],
            [css,'position:sticky'],
            [css,'top:env(safe-area-inset-top)'],
            [html,'styles.css?v=0.8.2'],
            [html,'app.js?v=0.8.2'],
            [sw,'dlp-dispatcher-v0.8.2']
          ];
          for(const [source,needle] of checks)if(!source.includes(needle))throw new Error(`Missing ${needle}`);
          NODE

      - name: Commit v0.8.2
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add app.js index.html styles.css sw.js README.md
          git commit -m 'DLP Dispatcher v0.8.2 sticky navigation'
          git push
