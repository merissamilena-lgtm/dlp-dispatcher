name: Audit DLP routing data

on:
  push:
    branches: [main]
    paths:
      - 'tools/audit-routing-data-v2.mjs'
      - 'tools/trigger-routing-audit.txt'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Audit ThemeParks.wiki and OpenStreetMap routing data
        run: node tools/audit-routing-data-v2.mjs
      - name: Commit routing audit
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add docs/routing-audit.md docs/routing-audit.json
          if git diff --cached --quiet; then
            echo 'No audit changes to commit.'
            exit 0
          fi
          git commit -m 'Refresh DLP precision routing audit'
          git push
