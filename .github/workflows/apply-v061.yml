name: Apply DLP Dispatcher v0.6.1

on:
  push:
    branches: [main]
    paths:
      - 'tools/apply-v061.mjs'
      - 'tools/trigger-v061.txt'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Apply v0.6.1 routing diagnostics patch
        run: node tools/apply-v061.mjs
      - name: Validate JavaScript
        run: |
          node --check app.js
          node --check sw.js
      - name: Verify diagnostic hooks
        run: |
          grep -q 'DLP DISPATCHER STATUS v0.6.1' app.js
          grep -q 'Routing diagnostics:' app.js
          grep -q 'function routingDiagnostic' app.js
          grep -q 'v0.6.1' index.html
      - name: Commit v0.6.1
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add app.js index.html sw.js README.md
          if git diff --cached --quiet; then
            echo 'No v0.6.1 changes to commit.'
            exit 0
          fi
          git commit -m 'DLP Dispatcher v0.6.1 routing diagnostics'
          git push
