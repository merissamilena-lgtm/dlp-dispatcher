name: Build DLP Dispatcher v0.6 routing data

on:
  push:
    branches: [main]
    paths:
      - 'tools/build-routing-v060.mjs'
      - 'tools/trigger-routing-v060.txt'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Build stroller-friendly routing data
        run: node tools/build-routing-v060.mjs
      - name: Commit routing data
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add data/routing-graph.json data/routing-locations.json
          if git diff --cached --quiet; then
            echo 'No routing data changes to commit.'
            exit 0
          fi
          git commit -m 'Build v0.6 stroller routing data'
          git push
