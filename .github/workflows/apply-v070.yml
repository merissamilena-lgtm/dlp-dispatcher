name: Apply DLP Dispatcher v0.7.0

on:
  push:
    branches: [main]
    paths:
      - 'tools/apply-v070.mjs'
      - 'tools/trigger-v070.txt'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Apply v0.7 timed commitments and mobile fixes
        run: node tools/apply-v070.mjs
      - name: Validate JavaScript
        run: |
          node --check app.js
          node --check sw.js
      - name: Verify timed commitment hooks
        run: |
          grep -q 'DLP DISPATCHER STATUS v0.7.0' app.js
          grep -q 'dynamicCommitments' app.js
          grep -q 'Add timed item' index.html
          grep -q 'timedType' index.html
          grep -q 'waits-heading' styles.css
          grep -q 'v0.7.0' index.html
      - name: Commit v0.7.0
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add app.js index.html styles.css sw.js README.md
          if git diff --cached --quiet; then
            echo 'No v0.7.0 changes to commit.'
            exit 0
          fi
          git commit -m 'DLP Dispatcher v0.7.0 timed commitments and mobile fixes'
          git push
