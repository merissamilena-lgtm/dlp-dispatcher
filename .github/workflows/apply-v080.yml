name: Apply DLP Dispatcher v0.8.0

on:
  push:
    branches: [main]
    paths:
      - 'tools/trigger-v080.txt'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Repair staged patcher blocks
        run: node tools/fix-v080-patcher.mjs

      - name: Apply v0.8.0 polish pass
        run: node tools/apply-v080.mjs

      - name: Validate JavaScript
        run: |
          node --check app.js
          node --check sw.js
          node --check worker/src/index.js

      - name: Validate Worker bundle
        working-directory: worker
        run: |
          npm install --no-audit --no-fund
          npx wrangler deploy --dry-run --outdir ../.wrangler-dry

      - name: Verify v0.8.0 feature anchors
        run: |
          node <<'NODE'
          const fs=require('fs');
          const checks=[
            ['app.js','DLP DISPATCHER STATUS v0.8.0'],
            ['app.js','RIDER_SWITCH_HANDOVER_MIN = 5'],
            ['app.js',"Next timed point: none active"],
            ['app.js','function decorateRideCards()'],
            ['app.js','function cloudStateData()'],
            ['index.html','data-view="rides"'],
            ['index.html','id="clearSearch"'],
            ['index.html','id="createSyncBtn"'],
            ['styles.css','-webkit-appearance:none!important'],
            ['styles.css','.reco.attention-tight'],
            ['sw.js',"self.addEventListener('push'"],
            ['sw.js',"dlp-dispatcher-v0.8.0"],
            ['worker/src/index.js','export class TripHub extends DurableObject'],
            ['worker/wrangler.jsonc','"TRIP_HUB"'],
            ['worker/wrangler.jsonc','"* * * * *"'],
          ];
          for(const [file,needle] of checks){
            const s=fs.readFileSync(file,'utf8');
            if(!s.includes(needle)) throw new Error(`${file} missing ${needle}`);
          }
          const html=fs.readFileSync('index.html','utf8');
          if(!html.includes('app.js?v=0.8.0')||!html.includes('styles.css?v=0.8.0'))throw new Error('index cache bump missing');
          NODE

      - name: Deploy Cloudflare Worker when credentials are connected
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          if [ -n "$CLOUDFLARE_API_TOKEN" ] && [ -n "$CLOUDFLARE_ACCOUNT_ID" ]; then
            cd worker
            npx wrangler deploy
          else
            echo 'Cloudflare credentials are not connected in GitHub; skipping Worker deployment. Core PWA deployment will continue.'
          fi

      - name: Commit v0.8.0
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add app.js index.html styles.css sw.js manifest.webmanifest README.md worker/src/index.js worker/wrangler.jsonc
          if git diff --cached --quiet; then
            echo 'No v0.8.0 changes to commit.'
            exit 0
          fi
          git commit -m 'DLP Dispatcher v0.8.0 polish pass'
          git push
