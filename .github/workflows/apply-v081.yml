name: Apply DLP Dispatcher v0.8.1

on:
  push:
    branches: [main]
    paths:
      - 'tools/trigger-v081.txt'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  hotfix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Apply selector hotfix
        run: node tools/apply-v081.mjs
      - name: Validate JavaScript and selectors
        run: |
          node --check app.js
          node --check sw.js
          node <<'NODE'
          const fs=require('fs');
          const s=fs.readFileSync('app.js','utf8');
          const required=[
            "$$('[data-view]').forEach",
            "$$('.ride-row').forEach",
            "$$('[data-unsnooze]').forEach",
            "$$('[data-rider-switch]').forEach",
            'DLP DISPATCHER STATUS v0.8.1'
          ];
          for(const x of required)if(!s.includes(x))throw new Error(`Missing ${x}`);
          const forbidden=[
            "$('[data-view]').forEach",
            "$('.ride-row').forEach",
            "$('[data-unsnooze]').forEach",
            "$('[data-rider-switch]').forEach"
          ];
          for(const x of forbidden)if(s.includes(x))throw new Error(`Single-element selector still used as a list: ${x}`);
          const html=fs.readFileSync('index.html','utf8');
          if(!html.includes('app.js?v=0.8.1')||!html.includes('styles.css?v=0.8.1'))throw new Error('v0.8.1 cache bump missing');
          const sw=fs.readFileSync('sw.js','utf8');
          if(!sw.includes('dlp-dispatcher-v0.8.1'))throw new Error('service worker cache bump missing');
          NODE
      - name: Commit v0.8.1
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add app.js index.html sw.js README.md
          git commit -m 'DLP Dispatcher v0.8.1 selector hotfix'
          git push
