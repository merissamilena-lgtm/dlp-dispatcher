name: Apply DLP Dispatcher v0.7.2

on:
  push:
    branches: [main]
    paths:
      - 'tools/apply-v072.mjs'
      - 'tools/trigger-v072.txt'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Apply v0.7.2 selector hotfix
        run: node tools/apply-v072.mjs
      - name: Validate JavaScript
        run: |
          node --check app.js
          node --check sw.js
      - name: Verify selector and cache bump
        run: |
          node <<'NODE'
          const fs=require('fs');
          const s=fs.readFileSync('app.js','utf8');
          const target='$$'+"('[data-remove-timed]').forEach";
          if(!s.includes(target)) throw new Error('double-dollar selector missing');
          NODE
          grep -q 'app.js?v=0.7.2' index.html
          grep -q 'styles.css?v=0.7.2' index.html
          grep -q 'dlp-dispatcher-v0.7.2' sw.js
      - name: Commit v0.7.2
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add app.js index.html sw.js README.md
          if git diff --cached --quiet; then
            echo 'No v0.7.2 changes to commit.'
            exit 0
          fi
          git commit -m 'DLP Dispatcher v0.7.2 selector hotfix'
          git push
