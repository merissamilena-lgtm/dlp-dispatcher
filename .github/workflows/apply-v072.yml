name: Apply DLP Dispatcher v0.7.2

on:
  push:
    branches: [main]
    paths:
      - 'tools/apply-v072.mjs'
      - 'tools/trigger-v072.txt'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Apply v0.7.2 selector hotfix
        run: node tools/apply-v072.mjs
      - name: Validate JavaScript
        run: |
          node --check app.js
          node --check sw.js
      - name: Verify selector and cache bump
        run: |
          node <<'NODE'
          const fs=require('fs');
          const checks=[
            ['app.js',"$$('[data-remove-timed]').forEach"],
            ['app.js','DLP DISPATCHER STATUS v0.7.2'],
            ['index.html','app.js?v=0.7.2'],
            ['index.html','styles.css?v=0.7.2'],
            ['sw.js','dlp-dispatcher-v0.7.2']
          ];
          for(const [file,needle] of checks){
            const s=fs.readFileSync(file,'utf8');
            if(!s.includes(needle)) throw new Error(`${file} missing ${needle}`);
          }
          NODE
      - name: Commit v0.7.2
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add app.js index.html sw.js README.md
          if git diff --cached --quiet; then
            echo 'No v0.7.2 changes to commit.'
            exit 0
          fi
          git commit -m 'DLP Dispatcher v0.7.2 selector hotfix'
          git push
