name: Apply DLP Dispatcher v0.7.1

on:
  push:
    branches: [main]
    paths:
      - 'tools/apply-v071.mjs'
      - 'tools/trigger-v071.txt'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Apply v0.7.1 hotfix
        run: node tools/apply-v071.mjs
      - name: Validate JavaScript
        run: |
          node --check app.js
          node --check sw.js
      - name: Verify hotfix
        run: |
          grep -Fq '$$(' app.js
          grep -Fq '[data-remove-timed]' app.js
          grep -q 'app.js?v=0.7.1' index.html
          grep -q 'styles.css?v=0.7.1' index.html
          grep -q 'dlp-dispatcher-v0.7.1' sw.js
      - name: Commit v0.7.1
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add app.js index.html sw.js README.md
          if git diff --cached --quiet; then
            echo 'No v0.7.1 changes to commit.'
            exit 0
          fi
          git commit -m 'DLP Dispatcher v0.7.1 timed-item hotfix'
          git push
